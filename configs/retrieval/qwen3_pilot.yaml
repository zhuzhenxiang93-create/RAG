embedding_model: Qwen/Qwen3-Embedding-0.6B
embedding_license: Apache-2.0
query_instruction: >-
  Given an anonymized Chinese criminal case fact, retrieve cases with legally
  relevant conduct, intent, result, accusation, and applicable statute.

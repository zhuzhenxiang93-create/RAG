dataset_dir: data/processed_v2_1_1
output_dir: artifacts/experiments/qwen3_4b_lora_school_full
max_length: 2048
truncation_strategy: head_tail
learning_rate: 0.0001
num_train_epochs: 2
per_device_train_batch_size: 8
per_device_eval_batch_size: 4
gradient_accumulation_steps: 4
warmup_ratio: 0.03
weight_decay: 0.01
logging_steps: 10
eval_steps: 500
save_steps: 500
save_total_limit: 2
bf16: true
gradient_checkpointing: true
group_by_length: true
token_length_cache: artifacts/cache/qwen3_4b_token_lengths/train.npy
length_bucket_boundaries: [256, 512, 1024, 2048]
pad_to_multiple_of: 8
seed: 42
threshold: 0.5

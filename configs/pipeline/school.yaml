classifier:
  enabled: true
  base_model: /data/zzhu126/models/Qwen3-4B
  adapter: artifacts/experiments/qwen3_4b_lora_school_full/checkpoint-7530
  label_mapping: data/processed_v2/label_mapping.json
  thresholds: artifacts/results/classifier_10k_2k/thresholds.json
  max_length: 2048
  truncation_strategy: head_tail
retrieval:
  mode: hybrid_rrf_rerank
  hybrid_index: artifacts/indexes/cail2018-v2_1_1-local
  candidate_k: 100
  fusion_top_k: 50
  rerank_top_k: 20
  rrf_k: 60
  label_boost: 0.15
  reranker_provider: local
  reranker_model: Qwen/Qwen3-Reranker-0.6B
  reranker_max_length: 2048
  reranker_batch_size: 8
  # Explicit degradation paths if the hybrid index or reranker cannot load.
  partitioned_index: artifacts/indexes/case_retrieval_by_charge
  bm25_index: artifacts/experiments/bm25_sparse64_eval_v2/index
  statute_bm25_index: artifacts/indexes/statutes_bm25_temporal_v3
  top_k: 3
generation:
  mode: pydantic_deterministic
  require_citation_validation: true
sentencing:
  enabled: true
  model_dir: artifacts/models/sentencing_baseline_v1_2
  evidence_dir: artifacts/indexes/sentencing_evidence_v1_2

source: data/processed_v2_1_1/train.jsonl
output_dir: artifacts/indexes/cail2018-v2_1_1
embedding_provider: api
embedding_model: qwen3.7-text-embedding
embedding_base_url_env: DASHSCOPE_BASE_URL
embedding_api_key_env: DASHSCOPE_API_KEY
embedding_api_batch_size: 20
embedding_max_length: 4096
embedding_dimension: 1024
query_instruction: >-
  Given a Chinese criminal case fact, retrieve legally relevant cases with
  similar conduct, charges, and applicable statutes.
reranker_provider: api
reranker_model: qwen3-rerank
reranker_url_env: DASHSCOPE_RERANK_URL
reranker_api_key_env: DASHSCOPE_API_KEY
reranker_timeout: 60
reranker_instruction: >-
  Rank Chinese criminal cases by factual conduct, charge elements, and
  applicable statutes for evidence-grounded legal analysis.
reranker_max_length: 2048
reranker_batch_size: 8
chunk_tokenizer_model: Qwen/Qwen3-0.6B
chunk_unit: tokens
chunk_size_tokens: 1024
chunk_overlap_tokens: 128
batch_size: 16
bm25_top_k: 100
vector_top_k: 100
fusion_top_k: 50
rerank_top_k: 20
final_top_k: 3
rrf_k: 60
label_boost: 0.15

name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Lite dependencies
        run: python -m pip install -r requirements-lite.txt
      - name: Check installed dependencies
        run: python -m pip check
      - name: Check Python syntax
        run: python -m compileall -q app scripts tests
      - name: Check frontend JavaScript syntax
        run: node --check frontend/app.js
      - name: Run tests
        env:
          DOCMIND_LOG_FORMAT: text
        run: python -B -m unittest discover -s tests -v

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Lite container
        run: docker build --tag docmind-rag:ci .

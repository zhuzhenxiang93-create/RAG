[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "docmind-rag"
version = "0.1.0"
description = "LoRA query routing for multi-source enterprise RAG"
requires-python = ">=3.9,<3.13"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py39"
